const CH = "tcegotec_chave";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const em64 = a => btoa(String.fromCharCode(...a));
async function decifrar(bruta){
  const k = await crypto.subtle.importKey("raw", bruta, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(D.iv)}, k, b64(D.dados)));
}
async function derivar(senha){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64(D.sal), iterations: D.it}, base, 256));
}
/* só troca depois de terminar de ler esta tela; antes disso o document.write mistura as duas páginas */
const pronto = new Promise(r => document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", r) : r());
async function escrever(html){ await pronto; document.open(); document.write(html); document.close(); }
(async () => {
  const [sal, chave] = (localStorage.getItem(CH) || "").split(":");
  if (sal === D.sal && chave){
    try { await escrever(await decifrar(b64(chave))); return; } catch (e){ localStorage.removeItem(CH); }
  }
  document.getElementById("espera").hidden = true;
  document.getElementById("caixa").hidden = false;
  document.getElementById("senha").focus();
})();
document.getElementById("caixa").onsubmit = async ev => {
  ev.preventDefault();
  const msg = document.getElementById("msg"), senha = document.getElementById("senha").value;
  if (!senha){ msg.textContent = "Digite a senha."; return; }
  msg.style.color = "inherit"; msg.textContent = "Conferindo…";
  try {
    const bruta = await derivar(senha), html = await decifrar(bruta);
    localStorage.setItem(CH, D.sal + ":" + em64(bruta));
    await escrever(html);
  } catch (e){
    msg.style.color = ""; msg.textContent = "Senha incorreta.";
  }
};
</script>
